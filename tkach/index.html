<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tavluno — учебный проект</title>
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <a class="header__logo" href="index.html" aria-label="Tavluno — главная">
          <img src="images/logo-icon.svg" alt="">
          <span>Tavluno</span>
        </a>

        <div class="header__navigation">
          <nav class="header__menu" aria-label="Основная навигация">
            <ul class="header__menu-list">
              <li class="header__menu-item">
                <button class="header__menu-button" type="button">
                  Продукты<img src="images/chevron.svg" alt="">
                </button>
              </li>
              <li class="header__menu-item">
                <button class="header__menu-button" type="button">
                  Решения<img src="images/chevron.svg" alt="">
                </button>
              </li>
              <li class="header__menu-item">
                <button class="header__menu-button" type="button">
                  Ресурсы<img src="images/chevron.svg" alt="">
                </button>
              </li>
              <li class="header__menu-item">
                <button class="header__menu-button" type="button">
                  Тарифы<img src="images/chevron.svg" alt="">
                </button>
              </li>
            </ul>
          </nav>

          <div class="header__actions">
            <button class="header__login" type="button">Войти</button>
            <button class="header__start" type="button">
              Tavluno бесплатно<img src="images/arrow-right.svg" alt="">
            </button>
          </div>
        </div>
      </div>
    </header>
    <main>
      <h1>Успевайте больше с Tavluno</h1>
    </main>
    <footer></footer>
  </body>
</html>
